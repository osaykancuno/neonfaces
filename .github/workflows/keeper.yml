# Runs tools/seed-keeper.mjs on GitHub's machines, no server and no one at the keyboard: since 2 Oct as a loop (a
# round a minute, like the manual keeper of launch day) for ≈ 5 h 40 min, then the run dispatches the next one, so a
# Face's basket arrives within minutes day and night. GitHub delays and drops scheduled runs (one every ≈ 6 h in
# practice), so the 10-minute schedule is only the safety net that restarts the chain if a dispatch is ever lost; the
# concurrency group keeps exactly one keeper running (never two runners on one key). The strategy agent
# (tools/agent-runner.mjs) runs once at the end of each turn. The keeper stocks and delivers seeds, top-ups and set bonuses,
# pays the split and the team vesting, finalizes a requested reveal as a safety net and refreshes marketplace
# metadata once a day. The strategy agent runs the strategies holders delegated to it.
#
# Setup (once, after the mainnet deploy; see docs/LAUNCH-RUNBOOK.md, "Automation"):
#   - commit contracts/deployments/4663.json (public addresses only)
#   - Settings > Secrets and variables > Actions:
#       secret   KEEPER_PK        the keeper key (KEEPER_ROLE on NeonSeedVault, a little ETH for gas, nothing else)
#       secret   RUNNER_PK        the strategy agent key (its address is STRATEGY_AGENT on the site; gas only)
#       variable KEEPER_CHAIN_ID  4663
#       variable RPC_URL          optional, defaults to the public Robinhood Chain RPC
# Public repositories run Actions for free; GitHub may delay scheduled runs by a few minutes, and it switches off
# scheduled workflows after 60 days without repository activity. The weekly "keepalive" job pushes one empty commit
# when the repository has been quiet for 45 days (a push is repository activity) and re-enables this workflow
# through the API as a second guard, so the keeper doesn't stop quietly months after the launch. If the default
# branch is protected, allow github-actions to push to it.
name: keeper

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 4 * * 1" # weekly keepalive
  workflow_dispatch:

# the job only reads the repo; the keys live in secrets and never reach a pull request (no pull_request trigger)
permissions:
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keepalive:
    if: ${{ github.event.schedule == '17 4 * * 1' }}
    runs-on: ubuntu-latest
    permissions: # only this job, only on the schedule: one empty commit, and re-enable this workflow
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: an empty commit after 45 quiet days
        run: |
          quiet=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$quiet" -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: GitHub switches schedules off after 60 quiet days"
            git push
          else
            echo "last commit $(( quiet / 86400 )) days ago: nothing to do"
          fi
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keeper.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  round:
    if: ${{ vars.KEEPER_CHAIN_ID != '' && github.event.schedule != '17 4 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub stops a job at 6 h; the loop ends itself at 5 h 40 min
    permissions:
      contents: read
      actions: write # dispatch the next turn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --ignore-scripts # no install scripts run next to the keys
        working-directory: tools
      # what the keeper already knows (Faces done, sets paid), carried from run to run
      - uses: actions/cache/restore@v4
        with:
          path: |
            tools/.keeper-state.json
            tools/.runner-state.json
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-
      - run: node seed-keeper.mjs ${{ vars.KEEPER_CHAIN_ID }}
        working-directory: tools
        env:
          PK: ${{ secrets.KEEPER_PK }}
          RPC_URL: ${{ vars.RPC_URL }}
          KEEPER_STATE: .keeper-state.json
          INTERVAL: 60
          RUN_FOR: 20400
      - name: strategy agent
        if: always()
        working-directory: tools
        env:
          RUNNER_PK: ${{ secrets.RUNNER_PK }}
          RPC_URL: ${{ vars.RPC_URL }}
          RUNNER_STATE: .runner-state.json
        run: |
          if [ -z "$RUNNER_PK" ]; then echo "RUNNER_PK not set: strategies off"; exit 0; fi
          node agent-runner.mjs ${{ vars.KEEPER_CHAIN_ID }} --once
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            tools/.keeper-state.json
            tools/.runner-state.json
          key: keeper-state-${{ github.run_id }}
      # the next turn: queued behind this run by the concurrency group, it starts as soon as this one ends
      - name: dispatch the next turn
        if: always()
        run: gh workflow run keeper.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
