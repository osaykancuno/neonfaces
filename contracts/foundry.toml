[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
gas_limit = 9223372036854775807
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./config" },
  { access = "read", path = "../art/output" },
  { access = "read", path = "../config" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
# Blockscout verification (no API key required, any non-empty string works)
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
